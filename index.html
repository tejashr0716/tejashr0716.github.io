<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jack -- 3D Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { kanit: ['Kanit', 'sans-serif'] }
    }
  }
}
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root, main {
    background: #0C0C0C;
    font-family: 'Kanit', sans-serif;
  }
  html { scroll-behavior: smooth; }
  body { -webkit-font-smoothing: antialiased; overflow-x: clip; }
  .hero-heading {
    background: linear-gradient(180deg, #646973 0%, #BBCCD7 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/framer-motion@11.18.2/dist/framer-motion.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
<script>
(function () {
  var files = ['boot.js', 'components.js', 'hero.js', 'marquee.js', 'about.js', 'services.js', 'projects.js', 'app.js'];
  function fail(file, err) {
    console.error('Failed to load', file, err);
  }
  function runNext(i) {
    if (i >= files.length) return;
    fetch(files[i] + '?v=jack-20261001d', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + files[i]);
        return r.text();
      })
      .then(function (code) {
        var out = Babel.transform(code, { presets: ['react'], filename: files[i] }).code;
        (new Function(out))();
        runNext(i + 1);
      })
      .catch(function (err) { fail(files[i], err); });
  }
  runNext(0);
})();
</script>
</body>
</html>
