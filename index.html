<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Foldcraft — Brand &amp; Visual Storytelling</title>
<meta name="description" content="Foldcraft — shaping visual narratives, one pixel at a time." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          geist: ['Geist', 'sans-serif'],
        },
      },
    },
  }
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.1.1",
    "react/jsx-runtime": "https://esm.sh/react@19.1.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@19.1.1?external=react",
    "react-dom/client": "https://esm.sh/react-dom@19.1.1/client?external=react",
    "lucide-react": "https://esm.sh/lucide-react@0.544.0?external=react"
  }
}
</script>
<script type="module">
import { createElement as h, useState } from 'react'
import { createRoot } from 'react-dom/client'
import { ArrowRight, Menu, X } from 'lucide-react'

const VIDEO_SRC = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260622_204221_5339e40b-e73d-4ab0-9c65-79c18c66fd50.mp4'

const navLinks = [
  { label: 'Home', href: '#home' },
  { label: 'Projects', href: '#projects' },
  { label: 'Studio', href: '#studio' },
  { label: 'Reach Us', href: '#reach' },
]

function App() {
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false)

  return h(
    'div',
    { className: 'relative h-screen w-full overflow-hidden bg-black font-geist' },
    h(
      'video',
      {
        autoPlay: true,
        muted: true,
        loop: true,
        playsInline: true,
        className: 'absolute inset-0 h-full w-full object-cover',
        style: { objectPosition: '70% center' },
      },
      h('source', { src: VIDEO_SRC, type: 'video/mp4' })
    ),
    h(
      'nav',
      { className: 'relative z-30 flex items-center justify-between px-6 py-5 md:px-12 lg:px-16' },
      h(
        'div',
        { className: 'flex items-center gap-8 lg:gap-12' },
        h('a', { href: '#home', className: 'text-lg font-semibold tracking-tight text-white sm:text-xl' }, 'Foldcraft'),
        h(
          'div',
          { className: 'hidden items-center gap-8 md:flex' },
          navLinks.map((link) =>
            h('a', {
              key: link.label,
              href: link.href,
              className: 'text-sm text-white/80 hover:text-white transition-colors',
            }, link.label)
          )
        )
      ),
      h(
        'a',
        {
          href: '#reach',
          className: 'hidden rounded-lg bg-white px-5 py-2 text-sm font-medium text-black hover:scale-105 transition-transform md:inline-flex',
        },
        "Let's Talk"
      ),
      h(
        'button',
        {
          type: 'button',
          className: 'relative z-50 flex h-10 w-10 items-center justify-center text-white md:hidden active:scale-90',
          'aria-label': mobileMenuOpen ? 'Close menu' : 'Open menu',
          'aria-expanded': mobileMenuOpen,
          onClick: () => setMobileMenuOpen((open) => !open),
        },
        h(Menu, {
          className: 'absolute transition-all duration-300 ' + (mobileMenuOpen ? 'rotate-90 scale-0 opacity-0' : 'rotate-0 scale-100 opacity-100'),
        }),
        h(X, {
          className: 'absolute transition-all duration-300 ' + (mobileMenuOpen ? 'rotate-0 scale-100 opacity-100' : '-rotate-90 scale-0 opacity-0'),
        })
      )
    ),
    h(
      'div',
      {
        className:
          'absolute inset-x-0 top-0 z-20 overflow-hidden bg-black/98 backdrop-blur-xl transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] ' +
          (mobileMenuOpen ? 'h-screen opacity-100' : 'h-0 opacity-0 pointer-events-none'),
      },
      h(
        'div',
        {
          className:
            'flex h-full flex-col justify-center gap-5 px-8 transition-all duration-500 delay-100 ' +
            (mobileMenuOpen ? 'translate-y-0 opacity-100' : 'translate-y-8 opacity-0'),
        },
        navLinks.map((link) =>
          h('a', {
            key: link.label,
            href: link.href,
            className: 'text-3xl font-medium text-white/90 hover:text-white',
            onClick: () => setMobileMenuOpen(false),
          }, link.label)
        ),
        h(
          'a',
          {
            href: '#reach',
            className: 'mt-6 w-fit rounded-full bg-white px-8 py-3.5 text-base font-medium text-black transition-transform hover:scale-105',
            onClick: () => setMobileMenuOpen(false),
          },
          "Let's Talk"
        )
      )
    ),
    h(
      'div',
      {
        className: 'relative z-10 flex h-[calc(100vh-80px)] flex-col justify-between px-6 pb-10 pt-12 sm:pb-12 sm:pt-16 md:px-12 md:pb-16 md:pt-20 lg:px-16',
      },
      h(
        'div',
        { className: 'max-w-3xl' },
        h(
          'p',
          { className: 'mb-4 animate-[fadeSlideUp_0.8s_ease_0.2s_both] text-xs text-white/90 sm:mb-6 sm:text-sm' },
          'Brand & Visual Storytelling'
        ),
        h(
          'h1',
          { className: 'animate-[fadeSlideUp_0.8s_ease_0.4s_both] text-3xl font-medium leading-[1.1] tracking-tight text-white sm:text-5xl md:text-6xl lg:text-7xl' },
          'Shaping visual',
          h('br'),
          'narratives,',
          h('br'),
          'one pixel at a time.'
        )
      ),
      h(
        'div',
        null,
        h(
          'p',
          { className: 'mb-5 max-w-sm animate-[fadeSlideUp_0.8s_ease_0.7s_both] text-sm leading-relaxed text-white/60 sm:mb-6 sm:max-w-lg sm:text-base md:text-lg' },
          'Turning vision into reality through craft, motion, and an endless pursuit of beauty.'
        ),
        h(
          'a',
          {
            href: '#projects',
            className: 'inline-flex animate-[fadeSlideUp_0.8s_ease_0.9s_both] items-center gap-2 rounded-lg bg-white px-5 py-2.5 text-sm font-medium text-black transition-transform hover:scale-105 sm:px-6 sm:py-3',
          },
          'Explore Work',
          h(ArrowRight, { size: 16 })
        )
      )
    )
  )
}

createRoot(document.getElementById('root')).render(h(App))
</script>
</body>
</html>
