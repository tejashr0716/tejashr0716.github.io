<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SkyElite — Private Jets</title>
<meta name="description" content="SkyElite — premium private jet charter, made accessible." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#05090d; --bg2:#081016; --card:rgba(12,20,27,.78); --line:rgba(255,255,255,.08);
  --orange:#ff7800; --orange2:#ff9d24; --red:#ff263c; --green:#46a171;
  --white:#f5f5f5; --muted:#84909a;
  --display:"Barlow Condensed","Nimbus Sans Narrow",Impact,sans-serif;
  --body:Inter,"Noto Sans",Arial,system-ui,sans-serif;
  --mono:"JetBrains Mono","Nimbus Mono PS",Menlo,monospace;
  --max:1120px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--white);font-family:var(--body);font-weight:300;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:4px}
::selection{background:var(--orange);color:#05090d}
body::after{content:"";position:fixed;inset:0;z-index:9;pointer-events:none;opacity:.04;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  background-size:120px 120px}
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding:0 24px}
header{position:fixed;inset:0 0 auto 0;z-index:50;backdrop-filter:blur(14px);background:rgba(5,9,13,.72);border-bottom:1px solid var(--line)}
.nav{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.mark{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.06em}
.mark span{color:var(--orange)}
.nav ul{display:flex;gap:28px;list-style:none}
.nav ul a{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:6px 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.nav ul a:hover,.nav ul a.on{color:var(--white)}
.nav ul a.on{border-color:var(--orange)}
.pill{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:10px 18px;border-radius:999px;color:#0b0600;
  background:linear-gradient(135deg,var(--orange),var(--orange2));transition:transform .2s,box-shadow .2s}
.pill:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(255,120,0,.28)}
.burger{display:none;width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer;align-items:center;justify-content:center;color:var(--white)}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(5,9,13,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.sheet.open{display:flex}
.sheet a{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:34px;letter-spacing:.02em;padding:10px 20px;min-height:44px}
.sheet .close{position:absolute;top:16px;right:20px;width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer}
.hero{min-height:100vh;height:100vh;display:flex;align-items:center;padding:96px 0 44px;position:relative;overflow:hidden;background:var(--bg)}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-overlay{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(5,9,13,.82) 0%,rgba(5,9,13,.55) 48%,rgba(5,9,13,.28) 100%),
  linear-gradient(180deg,rgba(5,9,13,.35) 0%,rgba(5,9,13,.15) 40%,rgba(5,9,13,.72) 100%);pointer-events:none}
.hero::before{content:"";position:absolute;width:900px;height:620px;left:-160px;bottom:-240px;z-index:1;
  background:radial-gradient(closest-side,rgba(255,120,0,.16),rgba(255,120,0,0));pointer-events:none}
.hero::after{content:"";position:absolute;width:700px;height:520px;right:-180px;top:-200px;z-index:1;
  background:radial-gradient(closest-side,rgba(255,255,255,.06),rgba(255,255,255,0));pointer-events:none}
.hero .wrap{position:relative;z-index:2}
.tag{position:absolute;right:24px;top:96px;z-index:2;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--muted)}
.avail{display:inline-flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 0 rgba(255,120,0,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,120,0,.5)}70%{box-shadow:0 0 0 10px rgba(255,120,0,0)}100%{box-shadow:0 0 0 0 rgba(255,120,0,0)}}
h1{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(52px,10vw,132px);line-height:.88;letter-spacing:-.03em}
h1 .b{display:block}
h1 .b.muted{color:rgba(245,245,245,.55)}
h1 .b.accent{color:var(--white)}
h1 .orangedot{display:inline-block;width:.12em;height:.12em;margin-left:.08em;background:var(--orange);vertical-align:.14em}
.role{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(16px,2vw,24px);letter-spacing:.04em;color:var(--white);margin-top:18px}
.role b{color:var(--orange);font-weight:700}
.pitch{margin-top:16px;color:var(--muted);max-width:56ch}
.cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}
.btn{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;padding:16px 26px;border-radius:8px;display:inline-flex;align-items:center;gap:10px;min-height:44px;transition:transform .2s,box-shadow .2s,border-color .2s,color .2s}
.btn.solid{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#0b0600}
.btn.solid:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,120,0,.3)}
.btn.ghost{border:1px solid var(--line);color:var(--white)}
.btn.ghost:hover{border-color:var(--orange);color:var(--orange)}
.scroll{position:absolute;left:24px;bottom:70px;z-index:2;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);
  writing-mode:vertical-rl;display:flex;align-items:center;gap:12px}
.scroll::after{content:"";width:1px;height:42px;background:linear-gradient(var(--orange),transparent)}
@media (max-width:980px){
  .nav ul,.nav .pill{display:none}
  .burger{display:flex}
  .tag,.scroll{display:none}
}
@media (max-width:620px){
  .wrap{padding:0 20px}
  .hero{padding:100px 0 56px}
  h1{font-size:clamp(40px,11.2vw,72px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .hero-video{display:none}
}
</style>
</head>
<body>
<header>
  <nav class="nav wrap" aria-label="Primary">
    <a class="mark" href="#start">SKYELITE<span>.</span></a>
    <ul>
      <li><a class="on" href="#start">Start</a></li>
      <li><a href="#story">Story</a></li>
      <li><a href="#rates">Rates</a></li>
      <li><a href="#benefits">Benefits</a></li>
      <li><a href="#faq">FAQ</a></li>
    </ul>
    <a class="pill" href="#rates">Book Now</a>
    <button class="burger" id="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sheet">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/>
      </svg>
    </button>
  </nav>
</header>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Menu">
  <button class="close" id="menu-close" type="button" aria-label="Close menu">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
    </svg>
  </button>
  <a href="#start">Start</a>
  <a href="#story">Story</a>
  <a href="#rates">Rates</a>
  <a href="#benefits">Benefits</a>
  <a href="#faq">FAQ</a>
  <a href="#rates" style="color:var(--orange)">Book Now</a>
</div>
<main id="start">
<section class="hero">
  <video class="hero-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
    <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_091828_e240eb17-6edc-4129-ad9d-98678e3fd238.mp4" type="video/mp4" />
  </video>
  <div class="hero-overlay" aria-hidden="true"></div>
  <span class="tag">CHARTER / 001 — PRIVATE</span>
  <div class="wrap">
    <span class="avail"><i class="dot"></i> Private jets</span>
    <h1>
      <span class="b muted">Premium.</span>
      <span class="b accent">Accessible<span class="orangedot"></span></span>
    </h1>
    <p class="role">Private charter — <b>Quiet luxury · On demand</b></p>
    <p class="pitch">Your dedication deserves recognition.</p>
    <div class="cta">
      <a class="btn solid" href="#story">Discover →</a>
      <a class="btn ghost" href="#rates">Book Now</a>
    </div>
  </div>
  <span class="scroll">Scroll</span>
</section>
</main>
<script>
(function(){
  var burger=document.getElementById('menu-button');
  var sheet=document.getElementById('sheet');
  var closeBtn=document.getElementById('menu-close');
  var open=document.body.getAttribute('data-menu')==='open';
  function render(){
    sheet.classList.toggle('open',open);
    burger.setAttribute('aria-expanded',open?'true':'false');
    document.body.style.overflow=open?'hidden':'';
  }
  burger.addEventListener('click',function(){open=true;render();});
  closeBtn.addEventListener('click',function(){open=false;render();});
  sheet.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){open=false;render();});});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){open=false;render();}});
  render();
})();
</script>
</body>
</html>
